<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Glowing Orbs -->
  <circle cx="200" cy="150" r="180" fill="#10b981" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="450" r="220" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>
  <circle cx="600" cy="300" r="160" fill="#06b6d4" opacity="0.08" filter="url(#glow)"/>

  <!-- Grid pattern overlay -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" />
    <path d="M100,0 V675 M200,0 V675 M300,0 V675 M400,0 V675 M500,0 V675 M600,0 V675 M700,0 V675 M800,0 V675 M900,0 V675 M1000,0 V675 M1100,0 V675" />
  </g>

  <!-- Central Header Badge -->
  <rect x="360" y="50" width="480" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="385" cy="71" r="6" fill="#10b981"/>
  <text x="405" y="76" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#34d399" letter-spacing="2">REAL-TIME STREAMING &amp; LAKEHOUSE ML</text>

  <!-- Main Title -->
  <text x="600" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">Fintech Fraud Detection Platform</text>
  <text x="600" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">Arquitectura Medallion · Motor Híbrido Reglas + LightGBM · Inferencia &lt;5ms</text>

  <!-- Central Visual: Pipeline Cards -->
  <!-- Card 1: Bronze Layer -->
  <rect x="80" y="235" width="300" height="340" rx="20" fill="url(#cardGrad)" stroke="#cd792c" stroke-width="1.5"/>
  <rect x="105" y="260" width="70" height="28" rx="8" fill="#cd792c" fill-opacity="0.2"/>
  <text x="140" y="279" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ea580c">BRONZE</text>
  <text x="105" y="325" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Streaming Ingest</text>
  <text x="105" y="355" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Redpanda / Kafka Broker</text>
  <text x="105" y="375" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Topic: transactions.raw</text>
  <text x="105" y="395" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Semántica at-least-once</text>
  <g transform="translate(105, 430)">
    <rect width="250" height="40" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
    <text x="15" y="25" font-family="monospace" font-size="12" fill="#38bdf8">Parquet Crudo + UTC</text>
  </g>
  <g transform="translate(105, 485)">
    <rect width="250" height="40" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
    <text x="15" y="25" font-family="monospace" font-size="12" fill="#38bdf8">Particionado por nameOrig</text>
  </g>

  <!-- Connector 1 -->
  <path d="M380,405 L440,405" stroke="#06b6d4" stroke-width="3" stroke-dasharray="6 4"/>
  <polygon points="445,405 435,399 435,411" fill="#06b6d4"/>

  <!-- Card 2: Silver Layer -->
  <rect x="450" y="235" width="300" height="340" rx="20" fill="url(#cardGrad)" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="475" y="260" width="70" height="28" rx="8" fill="#94a3b8" fill-opacity="0.2"/>
  <text x="510" y="279" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#cbd5e1">SILVER</text>
  <text x="475" y="325" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Polars Data Engine</text>
  <text x="475" y="355" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Deduplicación por clave</text>
  <text x="475" y="375" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Ecuaciones de balance</text>
  <text x="475" y="395" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Lazy scan de alto rendimiento</text>
  <g transform="translate(475, 430)">
    <rect width="250" height="40" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
    <text x="15" y="25" font-family="monospace" font-size="12" fill="#a78bfa">Feature Engineering</text>
  </g>
  <g transform="translate(475, 485)">
    <rect width="250" height="40" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
    <text x="15" y="25" font-family="monospace" font-size="12" fill="#a78bfa">Dataset Depurado</text>
  </g>

  <!-- Connector 2 -->
  <path d="M750,405 L810,405" stroke="#10b981" stroke-width="3" stroke-dasharray="6 4"/>
  <polygon points="815,405 805,399 805,411" fill="#10b981"/>

  <!-- Card 3: Gold Layer & Serving -->
  <rect x="820" y="235" width="300" height="340" rx="20" fill="url(#cardGrad)" stroke="#eab308" stroke-width="1.5"/>
  <rect x="845" y="260" width="70" height="28" rx="8" fill="#eab308" fill-opacity="0.2"/>
  <text x="880" y="279" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#facc15">GOLD</text>
  <text x="845" y="325" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Motor Híbrido &amp; API</text>
  <text x="845" y="355" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">50% Reglas + 50% ML</text>
  <text x="845" y="375" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">LightGBM clasificador</text>
  <text x="845" y="395" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">FastAPI &lt;5ms latencia</text>
  <g transform="translate(845, 430)">
    <rect width="250" height="40" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
    <text x="15" y="25" font-family="monospace" font-size="12" fill="#34d399">fraud_alerts &amp; KYC</text>
  </g>
  <g transform="translate(845, 485)">
    <rect width="250" height="40" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1"/>
    <text x="15" y="25" font-family="monospace" font-size="12" fill="#34d399">Streamlit Dashboard</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(180, 610)">
    <rect width="180" height="34" rx="17" fill="#1e293b" stroke="#334155"/>
    <text x="90" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">⚡ Latencia &lt;5ms</text>
  </g>
  <g transform="translate(380, 610)">
    <rect width="200" height="34" rx="17" fill="#1e293b" stroke="#334155"/>
    <text x="100" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#34d399">📊 6M+ Dataset PaySim</text>
  </g>
  <g transform="translate(600, 610)">
    <rect width="200" height="34" rx="17" fill="#1e293b" stroke="#334155"/>
    <text x="100" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#facc15">🎯 ROC-AUC: 1.0 (Test)</text>
  </g>
  <g transform="translate(820, 610)">
    <rect width="190" height="34" rx="17" fill="#1e293b" stroke="#334155"/>
    <text x="95" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a78bfa">🧪 38 Tests Passing</text>
  </g>
</svg>
